<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <h1 class="text-3xl font-bold mb-6">Submitted Applications</h1>
  <div id="applications" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <script>
    async function loadApplications() {
      try {
        const response = await fetch('/applications');
        const applications = await response.json();
        const container = document.getElementById('applications');
        container.innerHTML = applications.map(app => `
          <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold">${app.firstName} ${app.lastName}</h2>
            <p class="text-gray-600 mt-2">${app.description}</p>
            <div class="mt-4">
              <img src="${app.image1Url}" alt="Image 1" class="w-full h-32 object-cover rounded-md mb-2">
              <img src="${app.image2Url}" alt="Image 2" class="w-full h-32 object-cover rounded-md">
            </div>
            <p class="text-sm text-gray-500 mt-2">Submitted on ${new Date(app.createdAt).toLocaleString()}</p>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load applications', error);
      }
    }
    loadApplications();
  </script>
</body>
</html>
